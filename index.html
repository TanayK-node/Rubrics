<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG-Augmented Smart Grader</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #f0f2f5; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1a1a1a; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
        
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }
        .full-width { grid-column: 1 / -1; }
        
        .card { background: #fff; padding: 20px; border: 1px solid #e1e4e8; border-radius: 8px; }
        .card h3 { margin-top: 0; font-size: 16px; color: #333; display: flex; align-items: center; gap: 8px; }
        
        textarea { width: 100%; height: 150px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; resize: vertical; }
        input[type="file"] { width: 100%; font-size: 14px; }
        
        .badge { background: #e1f5fe; color: #0288d1; padding: 2px 8px; border-radius: 12px; font-size: 11px; text-transform: uppercase; font-weight: bold; }
        .badge-rag { background: #e8f5e9; color: #2e7d32; }

        button { display: block; width: 100%; padding: 16px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #cbd5e1; cursor: wait; }

        #results { margin-top: 30px; background: #1e1e1e; color: #e0e0e0; padding: 25px; border-radius: 8px; white-space: pre-wrap; font-family: "Menlo", "Consolas", monospace; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="container">
        <h1>CorrectAI 🧠</h1>
        <p class="subtitle">Multi-Agent Grading with RAG Fact-Checking</p>

        <div class="input-grid">
            <div class="card full-width">
                <h3>1. Grading Rubric</h3>
                <textarea id="rubric-input" placeholder="Paste your marking scheme here..."></textarea>
            </div>

            <div class="card">
                <h3>2. Student Submission <span class="badge">PDF</span></h3>
                <input type="file" id="answer-file" accept="application/pdf">
            </div>

            <div class="card" style="border-color: #81c784; background: #f9fdf9;">
                <h3>3. Reference Material <span class="badge badge-rag">RAG Source</span></h3>
                <p style="font-size: 12px; color: #555; margin-bottom: 10px;">Upload Textbook/Notes (PDF) to enable fact-checking.</p>
                <input type="file" id="reference-file" accept="application/pdf">
            </div>
        </div>

        <button id="grade-button">Start RAG Grading Pipeline</button>

        <div id="results-container" style="display:none;">
            <pre id="results"></pre>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
