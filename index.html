<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Paper Grading System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="file"] { border: 1px dashed #ccc; padding: 10px; width: 100%; box-sizing: border-box; background: #fafafa; }
        button { background-color: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        /* Table Styles */
        #results-section { display: none; margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f2f2f2; }
        .status-pending { color: #f39c12; font-weight: bold; }
        .status-done { color: #27ae60; font-weight: bold; }
        .status-error { color: #c0392b; font-weight: bold; }
        
        /* Modal Styles */
        #feedbackModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: #fff; width: 80%; max-width: 600px; margin: 50px auto; padding: 20px; border-radius: 8px; max-height: 80vh; overflow-y: auto; }
        .close-btn { float: right; cursor: pointer; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Automated Grading System</h1>
    
    <!-- Upload Section -->
    <div id="upload-section">
        <form id="gradingForm">
            <div class="form-group">
                <label for="apiKey">API Key (Optional / User Provided):</label>
                <input type="password" id="apiKey" name="apiKey" placeholder="Enter API Key here...">
            </div>

            <!-- UPDATED: Now accepts multiple PDFs for the Knowledge Base -->
            <div class="form-group">
                <label for="knowledgeBase">Course Content / Textbooks (Upload PDFs):</label>
                <input type="file" id="knowledgeBase" name="knowledgeBase" accept=".pdf" multiple required>
            </div>

            <div class="form-group">
                <label for="rubric">Grading Rubric:</label>
                <textarea id="rubric" name="rubric" rows="4" placeholder="Paste the specific rubric for this assignment..." required></textarea>
            </div>

            <!-- Upload for the actual student answers -->
            <div class="form-group">
                <label for="answerPapers">Upload Answer Papers (Bulk PDFs):</label>
                <input type="file" id="answerPapers" name="answerPapers" accept=".pdf" multiple required>
            </div>

            <button type="submit" id="submitBtn">Grade Papers</button>
        </form>
    </div>

    <!-- Results Dashboard Section -->
    <div id="results-section">
        <h2>Grading Dashboard</h2>
        <p id="overall-status">Status: <strong>Initializing...</strong></p>
        
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Student / File Name</th>
                    <th>Status</th>
                    <th>Score</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
                <!-- Rows will be populated by app.js -->
            </tbody>
        </table>
    </div>
</div>

<!-- Feedback Modal -->
<div id="feedbackModal">
    <div class="modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <h2 id="modalTitle">Feedback Details</h2>
        <div id="modalBody"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
